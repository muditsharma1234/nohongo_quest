*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans JP','Segoe UI',sans-serif;background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 50%,#16213e 100%);color:#e8e8f0;overflow:hidden}
#app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.header{background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;padding-top:max(14px,env(safe-area-inset-top))}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.xp-bar{width:80px;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:4px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,#E8453C,#F39C12);border-radius:2px;transition:width 0.5s ease}
.notification{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,0.4);animation:slideDown 0.3s ease;color:#fff}
.tab-bar{display:flex;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0}
.tab{flex:1;padding:10px 0 12px;background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;color:rgba(255,255,255,0.35);transition:all 0.2s;font-family:inherit}
.tab.active{color:#fff}
.tab-label{font-size:15px;font-weight:600}
.tab-sub{font-size:9px;opacity:0.5;margin-top:1px}
.card{background:rgba(255,255,255,0.03);border-radius:12px;padding:16px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:all 0.2s}
.card:active{transform:scale(0.98);opacity:0.8}
.vocab-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.vocab-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.srs-dot{width:8px;height:8px;border-radius:4px;flex-shrink:0}
.btn{border:none;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s}
.btn:active{transform:scale(0.96)}
.btn-primary{background:#E8453C;color:#fff}
.btn-ghost{background:rgba(255,255,255,0.06);color:#e8e8f0;border:1px solid rgba(255,255,255,0.08)}
.btn-full{width:100%}
.quiz-option{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px 20px;color:#e8e8f0;font-size:15px;font-weight:500;cursor:pointer;text-align:left;transition:all 0.2s;width:100%;font-family:inherit;margin-bottom:8px}
.quiz-option:active{transform:scale(0.98)}
.quiz-option.correct{background:rgba(46,204,113,0.15);border-color:rgba(46,204,113,0.4)}
.quiz-option.wrong{background:rgba(231,76,60,0.15);border-color:rgba(231,76,60,0.4)}
.bubble{max-width:85%;padding:12px 16px;border-radius:14px;margin-bottom:12px;animation:fadeIn 0.3s ease}
.bubble-you{background:rgba(232,69,60,0.15);border-bottom-right-radius:4px;margin-left:auto}
.bubble-npc{background:rgba(255,255,255,0.06);border-bottom-left-radius:4px}
.back-btn{background:none;border:none;color:rgba(255,255,255,0.4);font-size:13px;cursor:pointer;font-family:inherit;padding:4px 0}
.progress-bar{width:100%;height:3px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;margin-bottom:24px}
.progress-fill{height:100%;background:#E8453C;border-radius:2px;transition:width 0.3s}
.kanji-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{background:rgba(255,255,255,0.03);border-radius:10px;padding:12px;border:1px solid rgba(255,255,255,0.04)}
.stat-label{font-size:10px;opacity:0.3;text-transform:uppercase;letter-spacing:1px}
.stat-value{font-size:14px;font-weight:600;margin-top:4px}
.search-box{width:100%;padding:10px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#e8e8f0;font-size:14px;font-family:inherit;outline:none;margin-bottom:12px}
.search-box::placeholder{color:rgba(255,255,255,0.25)}
.search-box:focus{border-color:rgba(255,255,255,0.2)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.3s ease}
.map-area{position:relative;height:180px;background:linear-gradient(180deg,rgba(232,69,60,0.08) 0%,transparent 100%);overflow:hidden;padding:16px}
.loc-header{padding:0 20px;margin-top:-4px}
.bottom-nav{display:flex;background:rgba(255,255,255,0.04);border-top:1px solid rgba(255,255,255,0.06);flex-shrink:0;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.nav-item{flex:1;padding:10px 0;text-align:center;cursor:pointer;opacity:0.4;transition:opacity 0.2s;border:none;background:none;color:#e8e8f0;font-family:inherit}
.nav-item.active{opacity:1}
.nav-icon{font-size:18px}
.nav-label{font-size:9px;margin-top:2px}

// ========== STATE MANAGEMENT ==========
const STATE_KEY = 'nihongo_quest_state';
let state = loadState();

function defaultState(){
  return {xp:0,streak:0,srs:{},quizHistory:[],wordsLearned:new Set(),selectedLocation:"kyoto",screen:"map",tab:"vocab"};
}
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(STATE_KEY));
    if(!s) return defaultState();
    s.wordsLearned = new Set(s.wordsLearned||[]);
    return s;
  }catch(e){return defaultState();}
}
function saveState(){
  const s = {...state, wordsLearned: Array.from(state.wordsLearned)};
  localStorage.setItem(STATE_KEY, JSON.stringify(s));
}

// ========== HELPERS ==========
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function getSRSLevel(key){const d=state.srs[key];if(!d||d.t===0)return 0;const r=d.c/d.t;return r>=0.9?3:r>=0.7?2:r>=0.4?1:0;}
function srsColors(){return["rgba(255,255,255,0.1)","#e74c3c","#f39c12","#2ecc71"];}
function getLevel(){return Math.floor(state.xp/50)+1;}
function getXPInLevel(){return state.xp%50;}
function isUnlocked(locId){const loc=LOCATIONS.find(l=>l.id===locId);return state.xp>=loc.unlockXP;}
function getColor(locId){return LOCATIONS.find(l=>l.id===locId)?.color||"#E8453C";}
function el(tag,props,children){
  const e=document.createElement(tag);
  if(props){
    Object.entries(props).forEach(([k,v])=>{
      if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
      else if(k==='className')e.className=v;
      else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
      else if(k==='innerHTML')e.innerHTML=v;
      else e.setAttribute(k,v);
    });
  }
  if(children){
    if(typeof children==='string')e.textContent=children;
    else if(Array.isArray(children))children.forEach(c=>{if(c)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  }
  return e;
}

let notifTimer;
function notify(msg,type="info"){
  const existing=document.querySelector('.notification');
  if(existing)existing.remove();
  clearTimeout(notifTimer);
  const colors={success:"#2ecc71",error:"#e74c3c",info:"#3498db"};
  const n=el('div',{className:'notification',style:{background:colors[type]||colors.info}},msg);
  document.body.appendChild(n);
  notifTimer=setTimeout(()=>n.remove(),2500);
}

function addXP(amt){
  const before=state.xp;
  state.xp+=amt;
  LOCATIONS.forEach(loc=>{
    if(before<loc.unlockXP&&state.xp>=loc.unlockXP){
      notify(`🔓 ${loc.name} (${loc.romaji}) unlocked!`,"success");
    }
  });
  saveState();
}

let searchQuery = '';
function renderVocabTab(container){
  const locId=state.selectedLocation;
  const color=getColor(locId);
  const vocab=VOCAB_DB[locId]||[];

  // Search + Quiz bar
  const bar=el('div',{style:{display:'flex',gap:'10px',marginBottom:'12px',alignItems:'center'}});
  const searchInput=el('input',{className:'search-box',type:'text',placeholder:'Search words...',style:{flex:'1',marginBottom:'0'}});
  searchInput.value=searchQuery;
  searchInput.addEventListener('input',e=>{searchQuery=e.target.value;renderVocabList(list,vocab,locId,color);});
  bar.appendChild(searchInput);
  const quizBtn=el('button',{className:'btn btn-primary',style:{flexShrink:'0',padding:'10px 16px'},onClick:()=>startQuiz(locId)},'⚡ Quiz');
  bar.appendChild(quizBtn);
  container.appendChild(bar);

  const list=el('div');
  renderVocabList(list,vocab,locId,color);
  container.appendChild(list);
}

function renderVocabList(container,vocab,locId,color){
  container.innerHTML='';
  const q=searchQuery.toLowerCase();
  const filtered=q?vocab.filter(v=>v[0].includes(q)||v[1].includes(q)||v[2].toLowerCase().includes(q)||v[3].toLowerCase().includes(q)):vocab;

  filtered.forEach((v,i)=>{
    const key=`${locId}:${v[0]}:${v[2]}`;
    const level=getSRSLevel(key);
    const row=el('div',{className:'vocab-row',onClick:()=>{
      state.wordsLearned.add(v[0]+v[2]);
      state._detail={type:'vocab',data:v,locId};
      state.screen='detail';
      saveState();render();
    }},[
      el('div',{className:'vocab-icon',style:{background:`${color}15`,color}},v[0].charAt(0)),
      el('div',{style:{flex:'1',minWidth:'0'}},[
        el('div',{style:{display:'flex',alignItems:'baseline',gap:'8px'}},[
          el('span',{style:{fontSize:'16px',fontWeight:'600'}},v[0]),
          el('span',{style:{fontSize:'12px',opacity:'0.4'}},v[1]),
        ]),
        el('div',{style:{fontSize:'12px',opacity:'0.5',marginTop:'2px'}},`${v[2]} · ${v[3]}`),
      ]),
      el('div',{className:'srs-dot',style:{background:srsColors()[level]}}),
    ]);
    container.appendChild(row);
  });
  if(filtered.length===0){
    container.appendChild(el('div',{style:{textAlign:'center',opacity:'0.3',padding:'40px 0'}},'No words match your search.'));
  }
}

// ========== KANJI TAB ==========
function renderKanjiTab(container){
  const locId=state.selectedLocation;
  const color=getColor(locId);
  const vocab=VOCAB_DB[locId]||[];
  // Extract unique kanji from vocab
  const kanjiSet=new Set();
  const kanjiWords={};
  vocab.forEach(v=>{
    for(const ch of v[0]){
      if(ch.match(/[\u4e00-\u9faf]/)){
        kanjiSet.add(ch);
        if(!kanjiWords[ch])kanjiWords[ch]=[];
        kanjiWords[ch].push(`${v[0]} (${v[1]}) ${v[3]}`);
      }
    }
  });
  const kanjiList=[...kanjiSet];
  container.appendChild(el('div',{style:{fontSize:'12px',opacity:'0.4',marginBottom:'16px'}},`${kanjiList.length} kanji from vocabulary`));
  const grid=el('div',{className:'kanji-grid'});
  kanjiList.forEach(k=>{
    const card=el('div',{className:'card',style:{textAlign:'center'},onClick:()=>{
      state._detail={type:'kanji',data:{kanji:k,words:kanjiWords[k]||[]},locId};
      state.screen='detail';render();
    }},[
      el('div',{style:{fontSize:'36px',fontWeight:'800',color}},k),
      el('div',{style:{fontSize:'11px',opacity:'0.4',marginTop:'4px'}},`${(kanjiWords[k]||[]).length} words`),

}

// ========== QUIZ SCREEN ==========
let quizData=null;
function startQuiz(locId){
  const vocab=VOCAB_DB[locId]||[];
  if(vocab.length<4){notify("Not enough words for a quiz.","info");return;}
  const pool=shuffle(vocab);
  const qs=pool.slice(0,Math.min(10,pool.length)).map(v=>{
    const wrongPool=vocab.filter(w=>w[3]!==v[3]);
    const wrongs=shuffle(wrongPool).slice(0,3).map(w=>w[3]);
    const opts=shuffle([v[3],...wrongs]);
    return {word:v[0],hira:v[1],romaji:v[2],correct:v[3],opts,answered:null};
  });
  quizData={questions:qs,current:0,score:0,locId};
  state.screen='quiz';render();
}

function renderQuiz(container){
  if(!quizData){state.screen='map';render();return;}
  const{questions,current,score,locId}=quizData;
  const color=getColor(locId);

  // Finished
  if(current>=questions.length){
    const pct=Math.round((score/questions.length)*100);
    const wrap=el('div',{className:'fade-in',style:{padding:'20px',textAlign:'center',marginTop:'40px'}});
    wrap.appendChild(el('div',{style:{fontSize:'48px',marginBottom:'8px'}},pct>=80?'🎉':pct>=50?'💪':'📖'));
    wrap.appendChild(el('div',{style:{fontSize:'28px',fontWeight:'800'}},`${score}/${questions.length}`));
    wrap.appendChild(el('div',{style:{fontSize:'14px',opacity:'0.5',marginTop:'4px'}},`${pct}% correct · +${score*5} XP`));
    wrap.appendChild(el('button',{className:'btn btn-primary',style:{marginTop:'24px'},onClick:()=>{state.screen='map';render();}},'Continue'));
    container.appendChild(wrap);
    return;
  }

  const q=questions[current];
  const wrap=el('div',{className:'fade-in',style:{padding:'20px'}});

  // Top bar
  wrap.appendChild(el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'24px'}},[
    el('button',{className:'back-btn',onClick:()=>{state.screen='map';render();}},'✕ Exit'),
    el('span',{style:{fontSize:'12px',opacity:'0.4'}},`${current+1} / ${questions.length}`),
  ]));
  wrap.appendChild(el('div',{className:'progress-bar'},[el('div',{className:'progress-fill',style:{width:`${((current+1)/questions.length)*100}%`}})]));

  // Question
  wrap.appendChild(el('div',{style:{textAlign:'center',marginBottom:'32px'}},[
    el('div',{style:{fontSize:'11px',opacity:'0.3',textTransform:'uppercase',letterSpacing:'2px',marginBottom:'12px'}},'What does this mean?'),
    el('div',{style:{fontSize:'44px',fontWeight:'800',color}},q.word),
    el('div',{style:{fontSize:'15px',opacity:'0.4',marginTop:'6px'}},`${q.hira} · ${q.romaji}`),
  ]));

  // Options
  q.opts.forEach(opt=>{
    const btn=el('button',{className:'quiz-option'});
    btn.textContent=opt;
    if(q.answered!==null){
      if(opt===q.correct)btn.classList.add('correct');
      else if(opt===q.answered&&opt!==q.correct)btn.classList.add('wrong');
      btn.style.cursor='default';
    }else{
      btn.addEventListener('click',()=>{
        q.answered=opt;
        const correct=opt===q.correct;
        const key=`${locId}:${q.word}:${q.romaji}`;
        if(!state.srs[key])state.srs[key]={c:0,t:0};
        state.srs[key].t++;
        if(correct){state.srs[key].c++;addXP(5);state.streak++;}
        else{state.streak=0;}
        state.wordsLearned.add(q.word+q.romaji);
        saveState();render();
      });
    }
    wrap.appendChild(btn);
  });

  if(q.answered!==null){
    wrap.appendChild(el('button',{className:'btn btn-primary btn-full',style:{marginTop:'8px'},onClick:()=>{
      quizData.current++;
      if(q.answered===q.correct)quizData.score++;
      render();
    }},'Next →'));
  }
  container.appendChild(wrap);
}

// ========== DIALOGUE SCREEN ==========
function renderDialogue(container){
  const ds=state._dialogue;
  if(!ds){state.screen='map';render();return;}
  const{dialogue,lineIndex,showQuiz,quizAnswered}=ds;
  const wrap=el('div',{className:'fade-in',style:{padding:'20px'}});

  wrap.appendChild(el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}},[
    el('button',{className:'back-btn',onClick:()=>{state.screen='map';render();}},'✕ Exit'),
    el('span',{style:{fontSize:'12px',opacity:'0.4'}},dialogue.scene),
  ]));
  wrap.appendChild(el('div',{className:'card',style:{fontSize:'12px',opacity:'0.5',marginBottom:'16px'}},dialogue.npc));

  // Chat bubbles
  const chat=el('div',{style:{minHeight:'220px'}});
  dialogue.lines.slice(0,lineIndex+1).forEach(line=>{
    const bWrap=el('div',{style:{display:'flex',justifyContent:line.s==='you'?'flex-end':'flex-start',marginBottom:'12px'}});
    const b=el('div',{className:`bubble bubble-${line.s}`});
    b.appendChild(el('div',{style:{fontSize:'15px',fontWeight:'500',lineHeight:'1.5'}},line.jp));
    b.appendChild(el('div',{style:{fontSize:'11px',opacity:'0.4',marginTop:'4px'}},line.r));
    b.appendChild(el('div',{style:{fontSize:'12px',opacity:'0.5',marginTop:'2px',fontStyle:'italic'}},line.en));
    bWrap.appendChild(b);
    chat.appendChild(bWrap);
  });
  wrap.appendChild(chat);

  if(!showQuiz&&lineIndex<dialogue.lines.length-1){
    wrap.appendChild(el('button',{className:'btn btn-ghost btn-full',onClick:()=>{
      state._dialogue.lineIndex++;render();
    }},'Next line →'));
  }else if(!showQuiz){
    wrap.appendChild(el('button',{className:'btn btn-primary btn-full',onClick:()=>{
      state._dialogue.showQuiz=true;render();
    }},'📝 Comprehension Check'));
  }

  if(showQuiz){
    const qbox=el('div',{className:'fade-in',style:{marginTop:'12px'}});
    qbox.appendChild(el('div',{style:{fontSize:'14px',fontWeight:'600',marginBottom:'12px'}},dialogue.quiz.q));
    dialogue.quiz.opts.forEach((opt,i)=>{
      const btn=el('button',{className:'quiz-option'});
      btn.textContent=opt;
      if(quizAnswered!==null){
        if(i===dialogue.quiz.ans)btn.classList.add('correct');
        else if(i===quizAnswered&&i!==dialogue.quiz.ans)btn.classList.add('wrong');
      }else{
        btn.addEventListener('click',()=>{
          state._dialogue.quizAnswered=i;
          if(i===dialogue.quiz.ans){addXP(10);state.streak++;notify('+10 XP!','success');}
          else{state.streak=0;notify('Review the dialogue!','error');}
          saveState();render();
        });
      }
      qbox.appendChild(btn);
    });
    if(quizAnswered!==null){
      qbox.appendChild(el('button',{className:'btn btn-primary btn-full',style:{marginTop:'8px'},onClick:()=>{state.screen='map';render();}},'Back to Map'));
    }
    wrap.appendChild(qbox);
  }
  container.appendChild(wrap);
}

// ========== STATS SCREEN ==========
function renderStats(container){
  const wrap=el('div',{className:'fade-in',style:{padding:'20px',paddingBottom:'80px'}});
  wrap.appendChild(el('div',{style:{fontSize:'24px',fontWeight:'800',marginBottom:'20px'}},'📊 Progress'));

  const totalWords=Object.values(VOCAB_DB).reduce((a,b)=>a+b.length,0);
  const totalSRS=Object.keys(state.srs).length;
  const mastered=Object.entries(state.srs).filter(([,v])=>v.t>0&&v.c/v.t>=0.9).length;

  const grid=el('div',{className:'kanji-grid',style:{marginBottom:'20px'}});
  [{l:'Total XP',v:state.xp},{l:'Level',v:getLevel()},{l:'Words Seen',v:state.wordsLearned.size+'/'+totalWords},{l:'Mastered (SRS)',v:mastered},{l:'Quiz Attempts',v:totalSRS},{l:'Current Streak',v:state.streak}].forEach(s=>{
    grid.appendChild(el('div',{className:'stat-card'},[
      el('div',{className:'stat-label'},s.l),
      el('div',{className:'stat-value'},''+s.v),
    ]));
  });
  wrap.appendChild(grid);

  // Per location breakdown
  wrap.appendChild(el('div',{style:{fontSize:'14px',fontWeight:'600',marginBottom:'12px'}},'Location Breakdown'));
  LOCATIONS.forEach(loc=>{
    const vocabCount=VOCAB_DB[loc.id]?.length||0;
    const locSRS=Object.entries(state.srs).filter(([k])=>k.startsWith(loc.id+':')).length;
    const unlocked=isUnlocked(loc.id);
    const card=el('div',{className:'card',style:{opacity:unlocked?'1':'0.4'}},[
      el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},[
        el('div',{},[
          el('span',{style:{fontSize:'16px',fontWeight:'700',color:loc.color}},loc.name),
          el('span',{style:{fontSize:'12px',opacity:'0.4',marginLeft:'8px'}},loc.romaji),
        ]),
        el('span',{style:{fontSize:'12px',opacity:'0.5'}},unlocked?`${locSRS}/${vocabCount} quizzed`:`🔒 ${loc.unlockXP} XP`),
      ]),
    ]);
    wrap.appendChild(card);
  });

  // Reset button
  wrap.appendChild(el('div',{style:{marginTop:'30px',textAlign:'center'}},[
    el('button',{className:'btn btn-ghost',style:{fontSize:'12px',opacity:'0.5'},onClick:()=>{
      if(confirm('Reset all progress? This cannot be undone.')){
        localStorage.removeItem(STATE_KEY);
        state=defaultState();
        searchQuery='';
        render();
        notify('Progress reset.','info');
      }
    }},'Reset Progress'),
  ]));

  container.appendChild(wrap);
}

// ========== INIT ==========
render();
</script>
